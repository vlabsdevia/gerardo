<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 110" role="img" aria-label="Gerardo Pressure Washing">
  <!-- Spray-nozzle icon: handle + wand + fan of droplets -->
  <g fill="#fff">
    <!-- Wand body -->
    <rect x="8"  y="40" width="42" height="14" rx="3"/>
    <rect x="50" y="44" width="34" height="6"  rx="1.5"/>
    <!-- Trigger grip -->
    <path d="M14 54 L20 72 L34 72 L30 54 Z"/>
    <!-- Nozzle tip -->
    <path d="M84 42 L96 38 L96 56 L84 52 Z"/>
  </g>
  <!-- Spray fan (light droplets) -->
  <g fill="#fff" opacity="0.85">
    <circle cx="108" cy="34" r="2"/>
    <circle cx="118" cy="40" r="2.5"/>
    <circle cx="124" cy="47" r="3"/>
    <circle cx="118" cy="56" r="2.5"/>
    <circle cx="108" cy="62" r="2"/>
    <circle cx="132" cy="42" r="1.5"/>
    <circle cx="132" cy="54" r="1.5"/>
  </g>
  <!-- Wordmark -->
  <text x="0" y="92"
        font-family="Outfit, system-ui, sans-serif"
        font-weight="800"
        font-size="32"
        letter-spacing="-1"
        fill="#fff">GERARDO</text>
  <text x="2" y="106"
        font-family="Inter, system-ui, sans-serif"
        font-weight="600"
        font-size="9"
        letter-spacing="2.4"
        fill="#fff">PRESSURE WASHING</text>
</svg>
