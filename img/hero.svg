<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Pressure washer cleaning a brick driveway">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7F9"/>
      <stop offset="1" stop-color="#D5DCE2"/>
    </linearGradient>
    <pattern id="bricks" x="0" y="0" width="60" height="20" patternUnits="userSpaceOnUse">
      <rect width="60" height="20" fill="#E5EBEF"/>
      <path d="M0 0 H60 M0 10 H60 M0 20 H60 M0 0 V10 M30 10 V20 M60 0 V10" stroke="#001D3D" stroke-opacity="0.18" stroke-width="0.8"/>
    </pattern>
    <pattern id="bricksClean" x="0" y="0" width="60" height="20" patternUnits="userSpaceOnUse">
      <rect width="60" height="20" fill="#FFFFFF"/>
      <path d="M0 0 H60 M0 10 H60 M0 20 H60 M0 0 V10 M30 10 V20 M60 0 V10" stroke="#0284C7" stroke-opacity="0.22" stroke-width="0.8"/>
    </pattern>
    <radialGradient id="splash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky / background -->
  <rect width="800" height="380" fill="url(#sky)"/>
  <rect y="380" width="800" height="220" fill="url(#ground)"/>

  <!-- House silhouette -->
  <g transform="translate(80,90)">
    <polygon points="0,200 200,80 400,200" fill="url(#house)" opacity="0.92"/>
    <rect x="20" y="200" width="360" height="190" fill="url(#house)"/>
    <!-- Windows -->
    <rect x="60" y="240" width="60" height="60" rx="3" fill="#001D3D" opacity="0.85"/>
    <rect x="280" y="240" width="60" height="60" rx="3" fill="#001D3D" opacity="0.85"/>
    <line x1="90" y1="240" x2="90" y2="300" stroke="#fff" stroke-opacity="0.4"/>
    <line x1="60" y1="270" x2="120" y2="270" stroke="#fff" stroke-opacity="0.4"/>
    <line x1="310" y1="240" x2="310" y2="300" stroke="#fff" stroke-opacity="0.4"/>
    <line x1="280" y1="270" x2="340" y2="270" stroke="#fff" stroke-opacity="0.4"/>
    <!-- Door -->
    <rect x="170" y="270" width="60" height="120" rx="3" fill="#001D3D" opacity="0.9"/>
    <circle cx="220" cy="335" r="2.5" fill="#0EA5E9"/>
  </g>

  <!-- Driveway showing the BEFORE/AFTER divide -->
  <g>
    <!-- Dirty side (left) -->
    <rect x="0"   y="430" width="430" height="170" fill="url(#bricks)"/>
    <!-- Clean side (right) -->
    <rect x="430" y="430" width="370" height="170" fill="url(#bricksClean)"/>
    <!-- Subtle "wet edge" between them -->
    <rect x="425" y="430" width="14" height="170" fill="url(#splash)" opacity="0.7"/>
  </g>

  <!-- Pressure washer wand with spray -->
  <g transform="translate(360,310) rotate(15)">
    <!-- Wand -->
    <rect x="0"  y="0" width="120" height="14" rx="3" fill="#001D3D"/>
    <rect x="118" y="3" width="50"  height="8"  rx="1.5" fill="#001D3D"/>
    <!-- Trigger -->
    <path d="M22 14 L30 38 L52 38 L46 14 Z" fill="#001D3D"/>
    <!-- Tip -->
    <path d="M168 5 L184 0 L184 14 L168 9 Z" fill="#001D3D"/>
    <!-- Spray fan -->
    <g fill="#FFFFFF" opacity="0.95">
      <ellipse cx="206" cy="7"  rx="8"  ry="1.5"/>
      <ellipse cx="220" cy="7"  rx="10" ry="1.6"/>
      <ellipse cx="238" cy="7"  rx="12" ry="1.8"/>
      <ellipse cx="260" cy="7"  rx="16" ry="2.2"/>
    </g>
    <g fill="#FFFFFF" opacity="0.7">
      <circle cx="284" cy="2"  r="2"/>
      <circle cx="296" cy="6"  r="2.4"/>
      <circle cx="304" cy="12" r="2"/>
      <circle cx="296" cy="14" r="1.6"/>
      <circle cx="290" cy="0"  r="1.2"/>
      <circle cx="312" cy="6"  r="1.6"/>
      <circle cx="318" cy="2"  r="1"/>
      <circle cx="320" cy="12" r="1.4"/>
    </g>
  </g>

  <!-- Splash on ground where the spray hits -->
  <g transform="translate(560,410)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="url(#splash)" opacity="0.85"/>
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="-30" cy="-6" r="3"/>
      <circle cx="-10" cy="-12" r="2.4"/>
      <circle cx="20" cy="-10" r="3"/>
      <circle cx="40" cy="-4" r="2"/>
      <circle cx="-50" cy="0" r="2.2"/>
      <circle cx="55" cy="2" r="2.6"/>
    </g>
  </g>
</svg>
